<style>

:root[data-theme=dark]{--bg:#0a0f1e;--tx:#e8ecff;--mu:#9aa6c8;--gl:rgba(28,36,66,.5);--bd:rgba(255,255,255,.12);--ac:#818cf8;--a2:#22d3ee;--ln:rgba(160,180,255,.2);--sh:0 8px 32px rgba(0,0,0,.45);--in:rgba(8,12,28,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.55 Outfit,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 8% 0,color-mix(in srgb,var(--ac) 38%,transparent),transparent),radial-gradient(520px 420px at 100% 35%,color-mix(in srgb,var(--a2) 32%,transparent),transparent),radial-gradient(480px 380px at 25% 100%,rgba(236,72,153,.22),transparent)}
main{max-width:860px;margin:0 auto;padding:16px 14px 40px}
.gl{background:var(--gl);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:16px;margin:14px 0}
h1{font-size:clamp(34px,10vw,54px);margin:0;line-height:1;background:linear-gradient(90deg,var(--ac),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:18px;margin:0 0 8px}p{margin:.4em 0}.mu{color:var(--mu)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--gl);color:var(--tx);border-radius:13px;padding:8px 14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pri,.tabs .on{background:linear-gradient(135deg,#4f46e5,#0891b2);color:#fff;border:0}.pri{width:100%;padding:13px;font-weight:600;margin-top:6px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.tabs button{white-space:nowrap}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%;font-size:13px;text-align:center}th,td{padding:5px 4px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500;font-size:12px}
input[type=number]{width:100%;min-width:64px;font:inherit;padding:7px 5px;border-radius:10px;border:1px solid var(--ln);background:var(--in);color:var(--tx);text-align:center;box-sizing:border-box}
td.c{font-weight:600;color:var(--ac)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools label{display:flex;gap:6px;align-items:center}.tools input{width:80px}

ol{padding:0;list-style:none;counter-reset:s;margin:6px 0}li.st{counter-increment:s;padding:10px 10px 10px 46px;position:relative;border-radius:14px;margin:6px 0;background:var(--in);cursor:pointer}
li.st::before{content:counter(s);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--a2));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
li.st.d{opacity:.5;text-decoration:line-through}
.tip{border-left:3px solid var(--a2);padding:8px 12px;background:var(--in);border-radius:0 12px 12px 0;margin-top:10px}
.fm{font-size:17px;text-align:center;padding:10px;background:var(--in);border-radius:14px;margin:8px 0;font-weight:500}
details{background:var(--in);border-radius:12px;padding:9px 12px;margin:6px 0}summary{cursor:pointer;font-weight:500}
svg.dg{width:100%;max-height:270px}svg text{fill:var(--tx);font:12px Outfit,system-ui,sans-serif}.tk{fill:var(--mu);font-size:10px}
.gr{stroke:var(--ln);fill:none}.ln{stroke:var(--a2);stroke-width:2;stroke-dasharray:5 3;fill:none}.pl{stroke:var(--ac);stroke-width:2;fill:none}.pt{fill:var(--ac)}
[hidden]{display:none!important}.sm text{font-size:11px}
.mb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.mb .on{background:linear-gradient(135deg,#4f46e5,#0891b2);color:#fff;border:0}
.bc{font-size:14px;margin:4px 0;color:var(--mu)}.bc a{color:var(--ac);cursor:pointer;font-weight:500}
.card{cursor:pointer}.card h2{margin:2px 0;font-size:22px}
.pb{height:6px;border-radius:9px;background:var(--ln);overflow:hidden;margin-bottom:8px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--a2));transition:width .3s}
.gt{font-size:17px;margin:6px 0 14px}.gt ul{margin:0;padding-left:20px}.gn{display:flex;gap:8px}.gn button{flex:1;margin:0;width:auto}.gn button:disabled{opacity:.4}
.gd>.gl{display:none}.gd>.gcard,.gd>.sh{display:block}.gd #nx,.rec #nx{display:none}
.rec{--tx:#111;--mu:#555;--gl:#fff;--in:#f4f5fa;--bd:#d5d8e3;--ln:#c4c8d6;--ac:#1d2a6b;--a2:#1d2a6b;color:var(--tx)}
.rec>.gl{-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:6px;box-shadow:none;margin:0;border-top:0}
.rec .s5,.rec .s6,.rec .tip,.rec .s3>.mu,.rec .s1 p{display:none}
.rec li.st{background:none;padding:3px 0 3px 26px}.rec li.st::before{background:none;color:#111;left:0;width:auto;top:3px;border-radius:0;content:counter(s)"."}.rec li.st.d{opacity:1;text-decoration:none}
.rec input[type=number]{background:none;border:0;border-bottom:1px solid #888;border-radius:0}
@media print{.tabs,.mb,.top button,.tools,.bc,.top+p,#lead{display:none!important}body{background:#fff}.bg{display:none}.gl{page-break-inside:avoid}main{padding:0}}
</style></head><body><div class=bg></div><main>
<div class=top><div><span class=mu>Engineering Physics · 2002B</span><h1 id=h1 data-go="" style="cursor:pointer">Physics Lab</h1></div><button id=th>◐ Theme</button></div>
<p class=mu id=lead>Learn each experiment from zero: what to do, what to read, and exactly how to calculate. Tap “Fill sample data” to see a full worked run.</p>
<nav class=tabs id=tb></nav><div id=app></div></main>
<script>
const $=s=>document.querySelector(s),mean=a=>a.length?a.reduce((s,x)=>s+x)/a.length:NaN,ok=(R,k)=>R.map(r=>r[k]).filter(isFinite),f=(x,d=3)=>isFinite(x)?x.toFixed(d):'—',
out=a=>'<div class=kv>'+a.map(([l,v])=>`<div><small>${l}</small><b>${v}</b></div>`).join('')+'</div>',
fit=p=>{const n=p.length,S=g=>p.reduce((s,q)=>s+g(q),0),sx=S(q=>q[0]),sy=S(q=>q[1]),b=(n*S(q=>q[0]*q[1])-sx*sy)/(n*S(q=>q[0]**2)-sx*sx);return[(sy-b*sx)/n,b]};
function chart(p,xl,yl,o={}){if(p.length<2)return'<p class=mu>Enter at least 2 readings to see the graph.</p>';
const W=340,H=250,L=46,B=40,T=12,Rg=14,xm=Math.max(...p.map(a=>a[0]))*1.1,ym=Math.max(...p.map(a=>a[1]))*1.1,X=x=>L+x/xm*(W-L-Rg),Y=y=>H-B-y/ym*(H-B-T);
let s=`<svg class=dg viewBox="0 0 ${W} ${H}"><clipPath id=cp><rect x=${L} y=${T} width=${W-L-Rg} height=${H-B-T} /></clipPath>`;
for(let k=0;k<=5;k++){const a=xm*k/5,b=ym*k/5;s+=`<path class=gr d="M${X(a)} ${T}V${H-B}M${L} ${Y(b)}H${W-Rg}"/><text class=tk x=${X(a)} y=${H-B+13} text-anchor=middle>${+a.toPrecision(2)}</text><text class=tk x=${L-5} y=${Y(b)+3} text-anchor=end>${+b.toPrecision(2)}</text>`}
s+=`<text x=${(L+W)/2} y=${H-6} text-anchor=middle>${xl}</text><text transform=rotate(-90) x=${-(H-B+T)/2} y=12 text-anchor=middle>${yl}</text>`;
if(o.l)s+=`<path class=ln clip-path="url(#cp)" d="M${X(o.l[0][0])} ${Y(o.l[0][1])}L${X(o.l[1][0])} ${Y(o.l[1][1])}"/>`;
if(o.j)s+=`<path class=pl d="M${p.map(q=>X(q[0])+' '+Y(q[1])).join('L')}"/>`;
s+=p.map(q=>`<circle class=pt cx=${X(q[0])} cy=${Y(q[1])} r=3.5 />`).join('');
if(o.k!=null)s+=`<circle cx=${X(o.k)} cy=${Y(0)} r=5 fill=#f59e0b /><text x=${X(o.k)+8} y=${Y(0)-8} style="fill:#f59e0b;font-weight:600">Knee ${o.k.toFixed(2)} V</text>`;
return s+'</svg>'}
const DV=[.1,.2,.3,.4,.5,.55,.6,.65,.7,.75];
const kn=R=>{const p=R.filter(r=>isFinite(r.V)&&isFinite(r.I)).map(r=>[r.V,r.I]);if(p.length<3)return{p};const[a,b]=fit(p.slice(-3));return{p,a,b,x:-a/b}};
const E=[
{t:'U-tube',aim:'Find the relative density (and density) of a liquid that does not mix with water.',app:'U-tube on a stand, vertical scale, water, the given liquid, beakers.',
f:'Relative density = h₁ ÷ h₂<br>Density of liquid = (h₁ ÷ h₂) × 1000 kg/m³',
th:'Level O is the water–liquid boundary. At that level the pressure is the same in both limbs, so (water column h₁) × ρ<sub>water</sub> = (liquid column h₂) × ρ<sub>liquid</sub>. Water’s density is 1000 kg/m³.',
svg:`<svg class=dg viewBox="0 0 300 220"><g fill=none stroke-linecap=round><path d="M90 20V150Q90 195 130 195Q170 195 170 150V20" stroke=currentColor stroke-opacity=.3 stroke-width=26 /><path d="M90 80V150Q90 195 130 195Q170 195 170 150V120" stroke=#38bdf8 stroke-width=22 /><path d="M170 62V120" stroke=#f59e0b stroke-width=22 /><path d="M40 120H225" stroke=currentColor stroke-dasharray="4 4" /><path d="M62 80V120M202 62V120" stroke=currentColor /></g><text x=232 y=124>O</text><text x=56 y=104 text-anchor=end>h₁</text><text x=210 y=94>h₂</text><text x=130 y=48 text-anchor=middle style="fill:#38bdf8">● water</text><text x=130 y=66 text-anchor=middle style="fill:#f59e0b">● liquid</text></svg>`,
steps:['Clamp the U-tube upright. Put the vertical scale between the two limbs.','Pour water into the left limb. It rises to the same level in both limbs.','Slowly pour the given liquid into the right limb. It floats on the water.','Mark the water–liquid boundary in the right limb. Level O = that height (read it on the scale).','Read the top of the water in the left limb. h₁ = that reading − O (cm).','Read the top of the liquid in the right limb. h₂ = that reading − O (cm).','Add a little more water and liquid alternately and repeat for 6 trials.'],
tip:'Keep your eye level with the meniscus to avoid parallax. For a liquid lighter than water, h₂ comes out bigger than h₁, so the ratio is below 1.',
cols:[{k:'a',h:'h₁ water (cm)'},{k:'b',h:'h₂ liquid (cm)'},{k:'q',h:'h₁ ÷ h₂',f:r=>r.a/r.b}],n:6,
s:i=>({a:[8,10.4,12.2,13.6,16.1,19.8][i],b:[10,13,15,17,20,25][i]}),
ex:'h₁ = 8 cm, h₂ = 10 cm → 8 ÷ 10 = 0.8 → density = 0.8 × 1000 = 800 kg/m³.',
res:R=>{const m=mean(ok(R,'q'));return out([['Relative density (mean h₁/h₂)',f(m)],['Density of liquid',f(m*1000,0)+' kg/m³']])},
viva:[['Principle of the U-tube?','Liquid at rest has equal pressure at the same horizontal level, so the two columns balance.'],['Aim?','To find the relative density of a liquid that doesn’t mix with water.'],['Function of the given liquid?','It is the unknown liquid whose column balances the water column.'],['Hydrostatic pressure?','Pressure due to a liquid column: P = hρg.'],['U-tube manometer?','A U-tube that measures pressure difference from the liquid-level difference.']]},
{t:'Simple pendulum',aim:'Find the acceleration due to gravity (g) at your place.',app:'Simple pendulum with bob, stand, stopwatch, metre scale, two wooden blocks.',
f:'T = 2π√(l/g) &nbsp;⇒&nbsp; g = 4π² × (l ÷ T²)<br>T = (time for 20 oscillations) ÷ 20',
th:'l is the length from the point of suspension to the centre of the bob. For small swings, l ÷ T² stays constant, so a graph of T² against l is a straight line through the origin.',
svg:`<svg class=dg viewBox="0 0 300 220"><g fill=none stroke=currentColor stroke-width=2><path d="M100 14H220" stroke-width=5 /><path d="M160 14V176"/><path d="M160 14L202 170" stroke-dasharray="4 4" opacity=.5 /><path d="M120 14V176M114 14H126M114 176H126" stroke-width=1.5 /><path d="M160 198V212" /></g><circle cx=160 cy=176 r=16 fill=#4f46e5 /><circle cx=202 cy=170 r=16 fill=#4f46e5 opacity=.25 /><text x=108 y=100 text-anchor=end>l</text><text x=174 y=70>θ &lt; 10°</text><text x=176 y=208>chalk mark (rest position)</text></svg>`,
steps:['Hold the bob between two wooden blocks and measure its diameter d. Radius r = d ÷ 2.','Tie the thread so the distance from the suspension point to the top of the bob is (50 − r) cm. Then l = 50 cm.','Make a chalk mark under the bob at rest.','Pull the bob aside a little (under 10°) and release. Let it swing a few times.','Start the stopwatch as the bob crosses the mark. Count each pass in the same direction. Stop on the 20th. That is t₁.','Repeat once for t₂. Enter both below.','Repeat for l = 60, 70, 80, 90 and 100 cm.'],
tip:'Count “0” when you start the watch. Keep the swing in a straight line, not an oval. Large swings give wrong g.',
cols:[{k:'l',h:'l (cm)',p:[50,60,70,80,90,100]},{k:'t1',h:'t₁ for 20 osc (s)'},{k:'t2',h:'t₂ for 20 osc (s)'},{k:'tm',h:'Mean t (s)',f:r=>(r.t1+r.t2)/2,d:2},{k:'T',h:'T = t ÷ 20 (s)',f:r=>r.tm/20},{k:'T2',h:'T² (s²)',f:r=>r.T**2},{k:'k',h:'l ÷ T² (cm/s²)',f:r=>r.l/r.T2,d:1}],n:6,
s:i=>{const t=40.14*Math.sqrt((50+10*i)/100);return{t1:+(t+.12).toFixed(1),t2:+(t-.08).toFixed(1)}},
ex:'l = 50 cm, 20 oscillations = 28.4 s → T = 1.42 s → T² = 2.02 → l÷T² = 24.8 cm/s² = 0.248 m/s² → g = 4π² × 0.248 ≈ 9.8 m/s².',
res:R=>{const k=mean(ok(R,'k'));return out([['Mean l ÷ T²',f(k,1)+' cm/s²'],['= in SI',f(k/100,3)+' m/s²'],['g = 4π² × (l÷T²)',f(39.478*k/100,2)+' m/s²']])+'<p class=mu>Accepted value ≈ 9.8 m/s².</p>'},
ch:R=>{const p=R.filter(r=>isFinite(r.T2)&&isFinite(r.l)).map(r=>[r.l,r.T2]),s=p.reduce((a,q)=>a+q[0]*q[1],0)/p.reduce((a,q)=>a+q[0]**2,0);return chart(p,'l (cm)','T² (s²)',{l:[[0,0],[1e3,s*1e3]]})},
viva:[['What is a simple pendulum?','A small heavy bob on a light, inextensible thread swinging about a fixed point.'],['Time period?','Time for one complete oscillation.'],['Does T depend on the bob’s mass?','No. It is independent of mass.'],['Effective length?','Distance from the suspension point to the centre of the bob.'],['Why small oscillations?','The formula T = 2π√(l/g) holds only for small angles (under about 10°).']]},
{t:'Moment bar',aim:'Find the mass of a given body using the principle of moments.',app:'Metre scale, stand with string loop, slotted weights, the given body, thread.',
f:'M × OP = W × OQ &nbsp;⇒&nbsp; M = W × OQ ÷ OP',
th:'When the bar is horizontal and balanced, clockwise moment = anticlockwise moment. Moment = force × perpendicular distance from the pivot O. Both sides pull with their weights, so g cancels and masses can be used directly.',
svg:`<svg class=dg viewBox="0 0 320 200"><g stroke=currentColor stroke-width=2 fill=none><path d="M120 46H200M160 46V90"/><rect x=20 y=90 width=280 height=10 rx=3 fill=#4f46e5 fill-opacity=.3 /><path d="M160 100L148 126H172Z" fill=currentColor fill-opacity=.25 /><path d="M90 100V135M250 100V130"/><rect x=76 y=135 width=28 height=28 rx=4 fill=#f59e0b fill-opacity=.5 /><rect x=238 y=130 width=24 height=24 rx=4 fill=#38bdf8 fill-opacity=.5 /><path d="M90 176H160M160 176H250M90 170V182M160 170V182M250 170V182" stroke-width=1.5 /></g><text x=90 y=84 text-anchor=middle>P</text><text x=250 y=84 text-anchor=middle>Q</text><text x=160 y=142 text-anchor=middle>O</text><text x=90 y=153 text-anchor=middle>M</text><text x=250 y=146 text-anchor=middle>W</text><text x=125 y=194 text-anchor=middle>OP</text><text x=205 y=194 text-anchor=middle>OQ</text></svg>`,
steps:['Find the centre of gravity: balance the scale on a finger or edge and mark it as O (about 50 cm).','Hang the scale from the stand at O using a thread loop. It should stay horizontal.','Hang the given body at a point P on one side. Note OP = P reading − O reading.','Hang a known weight W on the other side. Slide it until the scale is horizontal again. That position is Q.','Read OQ (distance from O to Q).','Change W (for example 40, 50, 60, 80, 100, 120 g) and repeat. Six trials. The mean M is your answer.'],
tip:'Measure distances from the pivot O to the thread, not from the scale’s end. Don’t move P between trials unless you re-measure OP.',
cols:[{k:'W',h:'W (g)'},{k:'Q',h:'OQ (cm)'},{k:'P',h:'OP (cm)'},{k:'M',h:'M = W×OQ÷OP (g)',f:r=>r.W*r.Q/r.P,d:1}],n:6,
s:i=>({W:[50,60,80,100,40,120][i],Q:[32.1,26.5,19.8,16.2,40.3,13.4][i],P:20}),
ex:'W = 50 g, OQ = 32 cm, OP = 20 cm → M = 50 × 32 ÷ 20 = 80 g = 0.080 kg.',
res:R=>{const m=mean(ok(R,'M'));return out([['Mean mass M',f(m,1)+' g'],['In kg',f(m/1000,4)+' kg']])},
viva:[['SI unit of moment?','Newton metre (N m).'],['Aim?','To find the mass of a body using the principle of moments.'],['Why balance the bar horizontally first?','So the bar’s own weight acts at the pivot and gives no moment.'],['Sources of error?','Pivot not at the centre of gravity, wrong distances, friction at the loop.'],['Applications of moments?','Seesaw, spanner, crowbar, beam balance.']]},
{t:'Flywheel',aim:'Determine the moment of inertia of a flywheel.',app:'Flywheel on axle, cord, weight hanger and slotted weights, stopwatch, vernier calipers, metre scale.',
f:'I = [m·n₂ ÷ (n₁+n₂)] × (2gh ÷ ω² − r²)<br>ω = 4π·n₂ ÷ t &nbsp;(g = 9.8 m/s²)',
th:'The falling mass spins the wheel. After the cord slips off (n₁ turns), friction stops the wheel after n₂ more turns in time t. ω is the wheel’s angular speed at the moment the cord slips off.',
svg:`<svg class=dg viewBox="0 0 340 220"><g fill=none stroke=currentColor stroke-width=2><circle cx=110 cy=70 r=50 stroke-width=4 /><path d="M110 20V120M60 70H160M75 35L145 105M145 35L75 105" stroke-width=1.5 /><path d="M120 70V140"/><rect x=108 y=140 width=24 height=26 rx=3 fill=#f59e0b fill-opacity=.5 /><path d="M20 196H300" stroke-dasharray="5 4"/><path d="M170 166V196M164 166H176M164 196H176" stroke-width=1.5 /><path d="M110 8V18L105 8H115Z" fill=currentColor /></g><circle cx=110 cy=70 r=9 fill=#4f46e5 /><circle cx=110 cy=21 r=3.5 fill=#ef4444 /><text x=140 y=154>m</text><text x=180 y=185>h</text><text x=124 y=62>r</text><text x=96 y=12 text-anchor=end>pointer P</text><text x=196 y=50>n₁ = turns of cord</text><text x=196 y=68>n₂ = turns after it</text><text x=196 y=84>slips off, till rest</text><text x=24 y=190>ground</text></svg>`,
steps:['Measure the axle diameter with vernier calipers (as in Experiment 1). Enter d in cm below.','Make a chalk mark on the wheel’s rim to count turns against the pointer P.','Wind the cord n₁ = 8 turns side by side on the axle with a mass m (say 0.5 kg) hanging at its free end.','Measure h = height of the mass above the ground (about n₁ × 2πr).','Release the mass. When it touches the ground the cord slips off. Start the stopwatch at that instant.','Count n₂ = turns the wheel makes until it stops. Stop the watch. That is t.','Repeat with another m and n₁. Three trials. Take the mean I.'],
tip:'Use SI units: kg, m, s. Wind the cord without overlap. Count a turn each time the chalk mark passes the pointer.',
G:[{k:'d',l:'Axle diameter d (cm)',v:2}],
cols:[{k:'m',h:'m (kg)'},{k:'n1',h:'n₁'},{k:'h',h:'h (m)'},{k:'n2',h:'n₂'},{k:'t',h:'t (s)'},{k:'w',h:'ω = 4πn₂÷t (rad/s)',f:r=>4*Math.PI*r.n2/r.t,d:2},{k:'I',h:'I (kg m²)',f:(r,G)=>r.m*r.n2/(r.n1+r.n2)*(19.6*r.h/(r.w*r.w)-(G.d/200)**2),d:5}],n:3,
s:i=>({m:[.5,.5,1][i],n1:8,h:.5,n2:[40,41,30][i],t:[17.7,18.1,9.7][i]}),
ex:'m=0.5 kg, n₁=8, n₂=40, h=0.5 m, t=17.7 s, r=0.01 m → ω = 28.4 rad/s → I = (0.5×40÷48)(9.8÷28.4² − 0.01²) ≈ 0.0050 kg m².',
